name: Deploy to Vercel

# Manual only. Nothing deploys on push or pull request.
# Required repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Runtime variables (database, auth, AI keys) live in the Vercel project settings, never in Git.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Vercel environment to deploy
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

concurrency:
  group: vercel-${{ inputs.environment }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI: vercel@63.1.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run curriculum:public-check
      - run: npm run typecheck
      - name: Pull Vercel project settings
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=${{ inputs.environment == 'production' && 'production' || 'preview' }} --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build
        run: npx --yes "$VERCEL_CLI" build ${{ inputs.environment == 'production' && '--prod' || '' }} --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy prebuilt output
        run: npx --yes "$VERCEL_CLI" deploy --prebuilt ${{ inputs.environment == 'production' && '--prod' || '' }} --token="${{ secrets.VERCEL_TOKEN }}"
